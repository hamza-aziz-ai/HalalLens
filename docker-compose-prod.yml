services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set in .env}
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    image: halal-lens-api
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INDIAN_API_BASE_URL: ${INDIAN_API_BASE_URL:?set in .env}
      INDIAN_API_KEY: ${INDIAN_API_KEY:?set in .env}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      INGESTION_HEARTBEAT: /tmp/ingestion_heartbeat.txt
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
      # One worker until watchlists leave the JSON file store (.env.example).
      API_WORKERS: ${API_WORKERS:-1}
      # Caddy serves the UI and the API (under /api) on one origin.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${HALAL_APP_DOMAIN}}
      # Caddy replaces client-supplied X-Forwarded-For, so the first hop is the
      # real client. Safe only because the API port is not published (expose).
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      preflight:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
    expose:
      - "8001"
    command:
      [
        "sh",
        "-c",
        "uvicorn api.app:app --host 0.0.0.0 --port 8001 --workers ${API_WORKERS:-1} --proxy-headers --forwarded-allow-ips='*' --root-path /api"
      ]
    volumes:
      - logs_data:/app/logs
      # cache/watchlists.json (user watchlists and alert baselines) and vendor
      # caches must survive container recreation. Interim until watchlists move
      # to Postgres; see docs/HANDOVER.md.
      - api_cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test:
        [ "CMD", "python3", "-m", "tools.http_probe", "http://127.0.0.1:8001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
      # Same origin: Caddy routes /api/* to the API (see Caddyfile).
      args:
        NEXT_PUBLIC_HALAL_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - logs_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000',{method:'GET'}).then(r=>{if(!r.ok){process.exit(1);}process.exit(0);}).catch(()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  preflight:
    image: halal-lens-api
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python3", "-m", "tools.preflight"]
    volumes:
      - logs_data:/app/logs
    restart: "no"

  migrations:
    image: halal-lens-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/app/scripts/run_migrations.sh"]
    volumes:
      - logs_data:/app/logs
    restart: "no"

  caddy:
    image: caddy:2
    environment:
      HALAL_APP_DOMAIN: ${HALAL_APP_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: scheduler.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INDIAN_API_BASE_URL: ${INDIAN_API_BASE_URL:?set in .env}
      INDIAN_API_KEY: ${INDIAN_API_KEY:?set in .env}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
    entrypoint: ["python3", "-m", "jobs.schedule_ingestion"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "jobs.ingestion_health"]
      interval: 1m
      timeout: 10s
      retries: 3

  evaluation:
    build:
      context: .
      dockerfile: scheduler.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INDIAN_API_BASE_URL: ${INDIAN_API_BASE_URL:?set in .env}
      INDIAN_API_KEY: ${INDIAN_API_KEY:?set in .env}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      EVALUATION_INTERVAL_MINUTES: ${EVALUATION_INTERVAL_MINUTES:-15}
      EVALUATION_BATCH_LIMIT: ${EVALUATION_BATCH_LIMIT:-200}
      EVALUATION_LOOKBACK_DAYS: ${EVALUATION_LOOKBACK_DAYS:-365}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
    entrypoint: ["python3", "-m", "jobs.schedule_evaluations"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "jobs.evaluation_health"]
      interval: 1m
      timeout: 10s
      retries: 3

volumes:
  api_cache:
  postgres_data:
  minio_data:
  logs_data:
  caddy_data:
  caddy_config:
