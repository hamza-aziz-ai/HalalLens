# PDFs live in an external S3-compatible store (Cloudflare R2 by default):
# MinIO no longer publishes free images. Set MINIO_HOST/KEYS/BUCKET in .env.
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    image: halal-lens-api
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INDIAN_API_BASE_URL: ${INDIAN_API_BASE_URL:?set in .env}
      INDIAN_API_KEY: ${INDIAN_API_KEY:?set in .env}
      # Hard monthly cap across restarts (counted in the api_cache volume).
      INDIAN_API_MONTHLY_LIMIT: ${INDIAN_API_MONTHLY_LIMIT:-450}
      MINIO_HOST: ${MINIO_HOST:?set in .env}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-auto}
      MINIO_BUCKET: ${MINIO_BUCKET:-bse-pdfs}
      INGESTION_HEARTBEAT: /tmp/ingestion_heartbeat.txt
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-60}
      # One worker: the rate limiter is per-process memory (.env.example).
      API_WORKERS: ${API_WORKERS:-1}
      # Caddy serves the UI and the API (under /api) on one origin.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${HALAL_APP_DOMAIN}}
      # Caddy replaces client-supplied X-Forwarded-For, so the first hop is the
      # real client. Safe only because the API port is not published (expose).
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      preflight:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
    expose:
      - "8001"
    command:
      [
        "sh",
        "-c",
        "uvicorn api.app:app --host 0.0.0.0 --port 8001 --workers ${API_WORKERS:-1} --proxy-headers --forwarded-allow-ips='*' --root-path /api"
      ]
    volumes:
      - logs_data:/app/logs
      # Vendor caches and the Indian Stock API monthly quota counter must
      # survive container recreation (watchlists are in Postgres since v0.7).
      - api_cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test:
        [ "CMD", "python3", "-m", "tools.http_probe", "http://127.0.0.1:8001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
      # Same origin: Caddy routes /api/* to the API (see Caddyfile).
      args:
        NEXT_PUBLIC_HALAL_API_BASE_URL: /api
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@${HALAL_APP_DOMAIN}}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      # The UI image is static files behind Caddy: no Node.js to run a probe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  preflight:
    image: halal-lens-api
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_HOST: ${MINIO_HOST:?set in .env}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-auto}
      MINIO_BUCKET: ${MINIO_BUCKET:-bse-pdfs}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "-m", "tools.preflight"]
    volumes:
      - logs_data:/app/logs
    restart: "no"

  migrations:
    image: halal-lens-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/app/scripts/run_migrations.sh"]
    volumes:
      - logs_data:/app/logs
    restart: "no"

  caddy:
    image: caddy:2
    environment:
      HALAL_APP_DOMAIN: ${HALAL_APP_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
      # tls: Caddy serves the domain on 80/443 with Let's Encrypt.
      # tunnel: Caddy serves plain HTTP (":80") to cloudflared only; see the
      # cloudflared service below and the Caddyfile.
      CADDY_MODE: ${CADDY_MODE:-tls}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${HALAL_APP_DOMAIN}}
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    # Tunnel mode sets CADDY_BIND=127.0.0.1 so nothing outside the host can
    # reach Caddy directly (and pick its own Cf-Connecting-Ip).
    ports:
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Cloudflare Tunnel (tunnel mode only: COMPOSE_PROFILES=tunnel). Connects out
  # to Cloudflare, so the host needs no open web ports and no certificates.
  # In the Zero Trust dashboard, route the public hostname to http://caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped

  ingestion:
    # Same image as the api service; the entrypoint below picks the role.
    image: halal-lens-api
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The vendor plan is small (500 requests/month): scheduled jobs use the
      # free official Bhavcopy files for market data and keep the vendor quota
      # for users' on-demand lookups in the api service.
      INDIAN_API_BASE_URL: ""
      INDIAN_API_KEY: ""
      MINIO_HOST: ${MINIO_HOST:?set in .env}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-auto}
      MINIO_BUCKET: ${MINIO_BUCKET:-bse-pdfs}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
    entrypoint: ["python3", "-m", "jobs.schedule_ingestion"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "jobs.ingestion_health"]
      interval: 1m
      timeout: 10s
      retries: 3

  evaluation:
    # Same image as the api service; the entrypoint below picks the role.
    image: halal-lens-api
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The vendor plan is small (500 requests/month): scheduled jobs use the
      # free official Bhavcopy files for market data and keep the vendor quota
      # for users' on-demand lookups in the api service.
      INDIAN_API_BASE_URL: ""
      INDIAN_API_KEY: ""
      MINIO_HOST: ${MINIO_HOST:?set in .env}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-auto}
      MINIO_BUCKET: ${MINIO_BUCKET:-bse-pdfs}
      EVALUATION_INTERVAL_MINUTES: ${EVALUATION_INTERVAL_MINUTES:-15}
      EVALUATION_BATCH_LIMIT: ${EVALUATION_BATCH_LIMIT:-200}
      EVALUATION_LOOKBACK_DAYS: ${EVALUATION_LOOKBACK_DAYS:-365}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
    entrypoint: ["python3", "-m", "jobs.schedule_evaluations"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "jobs.evaluation_health"]
      interval: 1m
      timeout: 10s
      retries: 3

  backup:
    # Nightly pg_dump to the object store (R2), 14-day retention; see README_ops.
    image: halal-lens-api
    build:
      context: .
      dockerfile: api.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_HOST: ${MINIO_HOST:?set in .env}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-auto}
      MINIO_BUCKET: ${MINIO_BUCKET:-bse-pdfs}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - logs_data:/app/logs
    entrypoint: ["python3", "-m", "jobs.backup_postgres", "--loop"]
    restart: unless-stopped

volumes:
  api_cache:
  postgres_data:
  logs_data:
  caddy_data:
  caddy_config:
