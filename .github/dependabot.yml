version: 2
updates:
  # Actions are pinned by SHA; Dependabot rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Conventional titles ("build(deps): ..."): squash merges keep them, and
    # release-please treats build: as no release.
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
      actions-majors:
        update-types: [major]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    # One PR per group per month instead of one per package. Auto-merged by
    # dependabot-automerge.yml: ui-dev, and patch-level ui-security. ui-runtime
    # and ui-majors wait for a human.
    groups:
      ui-dev:
        dependency-type: development
        update-types: [minor, patch]
      ui-runtime:
        dependency-type: production
        update-types: [minor, patch]
      ui-majors:
        update-types: [major]
      # Security updates are a separate Dependabot mechanism: without a group
      # with applies-to, each advisory opens its own PR.
      ui-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Types follow the Node runtime (24 in CI and ui.Dockerfile), not the
      # newest Node. Raise together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Majors of the framework stack move together in one deliberate upgrade
      # (after the Playwright smoke test exists, docs/TESTING.md step 6):
      # Next 14 requires React 18, eslint-config-next pins eslint, and the test
      # tooling tracks React. Single bumps fail CI or break peers.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-environment-jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python is never auto-merged (ratio/ETL/billing libraries: review by hand).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        update-types: [minor, patch]
      python-majors:
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
