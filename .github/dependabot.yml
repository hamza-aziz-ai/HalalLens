version: 2
updates:
  # Actions are pinned by SHA; Dependabot rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Conventional titles ("build(deps): ..."): squash merges keep them, and
    # release-please treats build: as no release.
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # One PR per group per week instead of one per package. Only ui-dev is
    # auto-merged (dependabot-automerge.yml); ui-runtime waits for a human.
    groups:
      ui-dev:
        dependency-type: development
        update-types: [minor, patch]
      ui-runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime (20 in CI and ui.Dockerfile), not the
      # newest Node. Raise together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python is never auto-merged (ratio/ETL/billing libraries: review by hand).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        update-types: [minor, patch]
