name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege for every job; none of them writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (public repo); Dependabot keeps them fresh.
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        # Minor version must match [requires] in Pipfile and the Dockerfiles;
        # `pipenv install --deploy` fails on a mismatch.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --deploy

      # Fails if installed packages have conflicting requirements.
      - name: Check dependency consistency
        run: pipenv run pip check

      # Coverage floor (fail_under) lives in .coveragerc.
      - name: Run tests with coverage
        run: pipenv run pytest --cov --cov-report=term

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Coverage thresholds live in jest.config.cjs.
      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  # Builds the images from a clean checkout (only tracked files reach the build
  # context) and smoke-tests them without a database. Nothing is pushed and no
  # registry credentials are used here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build images
        run: |
          docker build -f api.Dockerfile -t halallens-api:ci .
          docker build -f ui.Dockerfile -t halallens-ui:ci .
          docker build -f scheduler.Dockerfile -t halallens-scheduler:ci .

      - name: Smoke-test images
        run: bash scripts/docker_smoke.sh halallens-api:ci halallens-ui:ci halallens-scheduler:ci

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret removed from the tip is still a leak.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
