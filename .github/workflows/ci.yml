name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege for every job; none of them writes to the repo.
permissions:
  contents: read

concurrency:
  # PRs: one group per branch, and a newer push supersedes the running one.
  # main: one group per commit, so no run is ever cancelled or dropped as a
  # pending duplicate. The image publish gate waits for CI on the release
  # commit; a cancelled run there blocked v0.10.0 when a merge landed seconds
  # after the release.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (public repo); Dependabot keeps them fresh.
jobs:
  # Docs-only changes (the same file set docs-automerge.yml accepts) skip the
  # build and test steps. Steps are skipped rather than jobs: a job skipped by
  # `if:` reports no `docker`/`docker-arm64` check for the matrix names, and
  # the ruleset requires them. The secrets scan always runs. Anything the diff
  # cannot be read for counts as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does the change touch anything but documentation?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs='^(docs/.+\.md|Documentations/.+\.md|README(_[A-Za-z]+)?\.md|CHANGELOG\.md)$'
          if files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null) && [ -n "$files" ] &&
              ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo "Docs-only change: build and test steps are skipped."
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  backend:
    runs-on: ubuntu-latest
    needs: changes
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        # Minor version must match [requires] in Pipfile and the Dockerfiles;
        # `pipenv install --deploy` fails on a mismatch.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --deploy

      # Fails if installed packages have conflicting requirements.
      - name: Check dependency consistency
        if: needs.changes.outputs.code == 'true'
        run: pipenv run pip check

      # Coverage floor (fail_under) lives in .coveragerc.
      - name: Run tests with coverage
        if: needs.changes.outputs.code == 'true'
        run: pipenv run pytest --cov --cov-report=term

  ui:
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint

      # Coverage thresholds live in jest.config.cjs.
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: npm test -- --coverage

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  # Builds the images from a clean checkout (only tracked files reach the build
  # context) and smoke-tests them without a database. Nothing is pushed and no
  # registry credentials are used here.
  docker:
    # Same build and smoke tests on amd64 and on GitHub's native arm64 runner
    # (Oracle Ampere hosts are arm64). The amd64 run keeps the check name
    # `docker`; the arm64 run reports as `docker-arm64`.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: docker
            runner: ubuntu-latest
          - check: docker-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: changes
    steps:
      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        if: needs.changes.outputs.code == 'true'
        run: |
          docker build -f api.Dockerfile -t halallens-api:ci .
          docker build -f ui.Dockerfile -t halallens-ui:ci .

      - name: Smoke-test images
        if: needs.changes.outputs.code == 'true'
        # The API image also runs the schedulers (compose sets their commands).
        run: bash scripts/docker_smoke.sh halallens-api:ci halallens-ui:ci halallens-api:ci

      # Production routing through Caddy: UI at /, API under /api/ on one origin.
      - name: Test the Caddy routing
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/proxy_smoke.sh halallens-api:ci halallens-ui:ci

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed from the tip is still a leak.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
