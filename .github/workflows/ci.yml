name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege for every job; none of them writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (public repo); Dependabot keeps them fresh.
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # Minor version must match [requires] in Pipfile and the Dockerfiles;
        # `pipenv install --deploy` fails on a mismatch.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --deploy

      # Fails if installed packages have conflicting requirements.
      - name: Check dependency consistency
        run: pipenv run pip check

      # Coverage floor (fail_under) lives in .coveragerc.
      - name: Run tests with coverage
        run: pipenv run pytest --cov --cov-report=term

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Coverage thresholds live in jest.config.cjs.
      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  # Builds the images from a clean checkout (only tracked files reach the build
  # context) and smoke-tests them without a database. Nothing is pushed and no
  # registry credentials are used here.
  docker:
    # Same build and smoke tests on amd64 and on GitHub's native arm64 runner
    # (Oracle Ampere hosts are arm64). The amd64 run keeps the check name
    # `docker`; the arm64 run reports as `docker-arm64`.
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: docker
            runner: ubuntu-latest
          - check: docker-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: |
          docker build -f api.Dockerfile -t halallens-api:ci .
          docker build -f ui.Dockerfile -t halallens-ui:ci .
          docker build -f scheduler.Dockerfile -t halallens-scheduler:ci .

      - name: Smoke-test images
        run: bash scripts/docker_smoke.sh halallens-api:ci halallens-ui:ci halallens-scheduler:ci

      # Production routing through Caddy: UI at /, API under /api/ on one origin.
      - name: Test the Caddy routing
        run: bash scripts/proxy_smoke.sh halallens-api:ci halallens-ui:ci

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed from the tip is still a leak.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
