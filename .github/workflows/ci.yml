name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege for every job; none of them writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (public repo); Dependabot keeps them fresh.
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        # Minor version must match [requires] in Pipfile and the Dockerfiles;
        # `pipenv install --deploy` fails on a mismatch.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --deploy

      # Fails if installed packages have conflicting requirements.
      - name: Check dependency consistency
        run: pipenv run pip check

      # Coverage floor (fail_under) lives in .coveragerc.
      - name: Run tests with coverage
        run: pipenv run pytest --cov --cov-report=term

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Coverage thresholds live in jest.config.cjs.
      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret removed from the tip is still a leak.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
