name: Auto-merge

# Maintainer decision (D-015): every pull request from this repository merges
# by itself (squash) as soon as the required checks (backend, ui, secrets) pass.
# This only *enables* GitHub auto-merge; the ruleset on main still blocks the
# merge until CI is green. Fork PRs are excluded: they never get secrets and
# outside contributions need a copyright decision first (D-013).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      # The personal token makes the eventual merge count as a normal push, so
      # CI, release-please and Pages run on main afterwards. Runs started by
      # Dependabot cannot read Actions secrets, so they fall back to
      # GITHUB_TOKEN unless the same token is also stored as a Dependabot secret.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
