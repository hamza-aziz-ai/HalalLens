# Production uptime check: every 30 minutes, GET <UPTIME_URL>/api/health.
# A failure opens (or comments on) one issue labelled `uptime`, which notifies
# the repository watchers; the next success closes it. The site address comes
# from the repository variable UPTIME_URL (e.g. https://example.com); without
# it the job does nothing, so forks and a fresh owner are not paged.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it under Actions if that happens.
name: Uptime

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    if: vars.UPTIME_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ vars.UPTIME_URL }}
    steps:
      - name: Check /api/health (3 tries)
        id: probe
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' -m 20 "${URL%/}/api/health" || echo 000)
            if [ "$code" = 200 ] && grep -q '"ok"' body.txt; then
              echo "status=up" >> "$GITHUB_OUTPUT"
              echo "up ($code) on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 20
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Open or update the outage issue
        if: steps.probe.outputs.status == 'down'
        run: |
          gh label create uptime --color B60205 --description "Production health check" 2>/dev/null || true
          issue=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          note="Health check failed at $(date -u +%FT%TZ): HTTP ${{ steps.probe.outputs.code }} from /api/health. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$note"
          else
            gh issue create --label uptime --title "Production is down: /api/health failing" --body "$note"
          fi
          exit 1

      - name: Close the outage issue after recovery
        if: steps.probe.outputs.status == 'up'
        run: |
          for issue in $(gh issue list --label uptime --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Recovered at $(date -u +%FT%TZ): /api/health returns 200."
          done
